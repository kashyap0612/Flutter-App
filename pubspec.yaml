name: leaf_disease_inference_app
description: Two-stage on-device leaf detection and disease classification app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  image: ^4.2.0
  path_provider: ^2.1.4
  tflite_flutter: ^0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/leaf_detection.tflite
    - assets/models/disease_classification.tflite
    - assets/labels/leaf_labels.txt
    - assets/labels/disease_labels.txt
